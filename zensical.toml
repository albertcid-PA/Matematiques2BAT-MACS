[project]
site_name = "Matemàtiques Aplicades a les Ciències Socials II"
site_description = "Apunts de Matemàtiques Aplicades a les Ciències Socials II de segon de batxillerat"
site_url = "https://albertcid-pa.github.io/Matematiques2BAT-MACS/"
repo_url = "https://github.com/albertcid-PA/Matematiques2BAT-MACS"
repo_name = "albertcid-PA/Matematiques2BAT-MACS"

nav = [
  { "Inici" = "index.md" },
  { "Càlcul" = [
    { "Introducció" = "calcul/index.md" },
    { "1. Repàs de límits i derivades" = [
      { "Índex" = "calcul/repas-limits-derivades/index.md" },
      { "Repàs de límits" = "calcul/repas-limits-derivades/01_limits.md" },
      { "Repàs de derivades" = "calcul/repas-limits-derivades/02_derivades.md" },
    ] },
    { "2. Aplicacions de les derivades" = [
      { "Índex" = "calcul/aplicacions-derivades/index.md" },
      { "Derivabilitat" = "calcul/aplicacions-derivades/01_derivabilitat.md" },
      { "Creixement i extrems" = "calcul/aplicacions-derivades/02_creixement-extrems.md" },
      { "Representació de funcions" = "calcul/aplicacions-derivades/03_representacio-funcions.md" },
      { "Optimització" = "calcul/aplicacions-derivades/04_optimitzacio.md" },
    ] },
    { "Per practicar" = [
      { "Exercicis i problemes" = "calcul/per-practicar/solucionari.md" },
    ] },
    { "Laboratori de mates" = [
      { "Índex" = "calcul/eines/index.md" },
      { "Analitzador de funcions" = "calcul/eines/analitzador-funcions.md" },
      { "Derivador pas a pas" = "calcul/eines/derivador-pas-a-pas.md" },
    ] },
  ] },
  { "Àlgebra lineal" = [
    { "Introducció" = "algebra-lineal/index.md" },
    { "3. Sistemes i mètode de Gauss" = [
      { "Índex" = "algebra-lineal/sistemes-gauss/index.md" },
      { "Sistemes d'equacions lineals" = "algebra-lineal/sistemes-gauss/01_sistemes-equacions-lineals.md" },
      { "Mètode de Gauss" = "algebra-lineal/sistemes-gauss/02_metode-gauss.md" },
      { "Problemes de sistemes" = "algebra-lineal/sistemes-gauss/03_plantejament-problemes.md" },
    ] },
    { "4. Matrius" = [
      { "Índex" = "algebra-lineal/matrius/index.md" },
      { "Concepte i tipus de matrius" = "algebra-lineal/matrius/01_concepte-tipus.md" },
      { "Operacions amb matrius" = "algebra-lineal/matrius/02_operacions.md" },
      { "Matriu inversa" = "algebra-lineal/matrius/03_matriu-inversa.md" },
      { "Equacions i sistemes matricials" = "algebra-lineal/matrius/04_equacions-sistemes-matricials.md" },
      { "Problemes de matrius" = "algebra-lineal/matrius/05_problemes-matrius.md" },
    ] },
    { "Per practicar" = [
      { "Exercicis i problemes" = "algebra-lineal/per-practicar/solucionari.md" },
    ] },
    { "Laboratori de mates" = [
      { "Índex" = "algebra-lineal/eines/index.md" },
      { "Resolució de sistemes" = "algebra-lineal/eines/resolucio-sistemes.md" },
      { "Operacions amb matrius" = "algebra-lineal/eines/calculadora-matrius.md" },
      { "Equacions matricials" = "algebra-lineal/eines/aillament-equacions-matricials.md" },
      { "Sistemes matricials" = "algebra-lineal/eines/sistemes-matricials.md" },
    ] },
  ] },
  { "Probabilitat i estadística" = [
    { "Introducció" = "probabilitat-estadistica/index.md" },
    { "5. Probabilitat i teorema de Bayes" = "probabilitat-estadistica/probabilitat/index.md" },
    { "6. Distribucions de probabilitat" = "probabilitat-estadistica/distribucions/index.md" },
    { "7. Inferència estadística" = "probabilitat-estadistica/inferencia/index.md" },
    { "Per practicar" = [
      { "Índex" = "probabilitat-estadistica/per-practicar/index.md" },
      { "Exercicis dels temes 5, 6 i 7" = "probabilitat-estadistica/exercicis.md" },
      { "Problemes PAU" = "probabilitat-estadistica/problemes-pau.md" },
    ] },
  ] },
  { "Preparació d'exàmens" = [
    { "Índex" = "preparacio-examens/index.md" },
    { "Prova parcial del 1r trimestre núm. 1: Càlcul" = "preparacio-examens/pp1-1.md" },
  ] },
]

extra_javascript = [
  "javascripts/katex.js",
  "https://unpkg.com/katex@0/dist/katex.min.js",
  "https://unpkg.com/katex@0/dist/contrib/auto-render.min.js",
  "javascripts/function-analyzer-loader.js?v=3",
  "javascripts/linear-system-loader.js?v=1",
  "javascripts/matrix-equation-isolator-loader.js?v=2",
  "javascripts/matrix-calculator-loader.js?v=1",
]

extra_css = [
  "https://unpkg.com/katex@0/dist/katex.min.css",
  "stylesheets/extra.css?v=30",
]

[project.theme]
language = "ca"
features = [
  "content.code.copy",
  "content.footnote.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/sigma"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Canvia el tema"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Activa el mode fosc"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Segueix el tema del sistema"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc = { permalink = true }
pymdownx.arithmatex = { generic = true }
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tasklist = { custom_checkbox = true }
