name: Publica els apunts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Descarrega el repositori
        uses: actions/checkout@v7

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Instal·la Zensical
        run: pip install zensical

      - name: Instal·la LaTeX, TikZ i PGFPlots
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-pictures \
            dvisvgm

      - name: Genera automàticament les figures TikZ
        shell: pwsh
        run: ./scripts/compila_figures.ps1

      - name: Construeix el web
        run: zensical build --clean

      - name: Prepara el web per publicar-lo
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publica el web
        id: deployment
        uses: actions/deploy-pages@v5
